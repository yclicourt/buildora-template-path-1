name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://{{POSTGRES_USER}}:cambia-esta-clave@localhost:5432/{{POSTGRES_DB}}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: {{POSTGRES_USER}}
          POSTGRES_PASSWORD: cambia-esta-clave
          POSTGRES_DB: {{POSTGRES_DB}}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Sin este paso el build falla: el cliente de Prisma se genera
      # en src/shared/database/generated y no se commitea.
      - run: pnpm exec prisma generate --schema src/shared/database/prisma/schema.prisma
      - run: pnpm build
      # Todavía no hay tests unitarios en el repo; sin este flag jest falla
      # con "No tests found" y el CI iría en rojo sin motivo.
      - run: pnpm exec jest --passWithNoTests
